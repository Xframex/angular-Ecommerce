<div class="login-page">
  <div class="login-card">

    <!-- Title -->
    <h2>
      {{ isAuthenticated ? ('Welcome, ' + userName) : 'Login' }}
    </h2>

    <!-- Optional subtitle -->
    <p class="subtitle" *ngIf="!isAuthenticated">
      Sign in to continue
    </p>

    <!-- Login button -->
    <button 
      *ngIf="!isAuthenticated"
      class="login-btn"
      (click)="login()">
      Sign in with Okta
    </button>

    <!-- Logged in state -->
    <div *ngIf="isAuthenticated" class="welcome-box">
      <p>You are successfully logged in 🎉</p>

      <button class="logout-btn" (click)="logout()">
        Logout
      </button>
    </div>

  </div>
</div>
